<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f4ed">
  <meta name="description" content="WONS ARCHIVE photography portfolio">
  <title>WONS ARCHIVE</title>
  <link rel="stylesheet" href="style.css?v=11">
  <script src="script.js?v=9" defer></script>
</head>
<body>
  <header id="top" class="site-header">
    <h1>WONS ARCHIVE</h1>
    <nav id="filters" class="filters" aria-label="Photo categories"></nav>
  </header>
  <main id="works" aria-labelledby="galleryTitle">
    <h2 id="galleryTitle" class="gallery-title" aria-live="polite">All Work</h2>
    <div id="gallery" class="gallery"></div>
    <noscript>Enable JavaScript to view the gallery.</noscript>
  </main>
  <dialog id="lightbox" class="lightbox" aria-label="Photo viewer">
    <button class="lightbox-close" id="closeLightbox" aria-label="Close" autofocus>×</button>
    <div class="lightbox-content">
      <button id="prevPhoto" aria-label="Previous photo">←</button>
      <figure>
        <img id="lightboxImage" alt="">
        <figcaption id="lightboxCaption"></figcaption>
      </figure>
      <button id="nextPhoto" aria-label="Next photo">→</button>
    </div>
  </dialog>
</body>
</html>
